# VoidFlippr - internal-only nginx config.
# Listens on 127.0.0.1:8080. Used for smoke testing the Node server through
# nginx without exposing anything externally. The public + LAN configs both
# proxy to the Node server on 127.0.0.1:9865 directly; this file is purely
# for verification (e.g. `./deploy.sh` curls http://127.0.0.1:8080).

server {
    listen 127.0.0.1:8080;
    server_name _;

    access_log /var/log/nginx/voidflippr-internal.access.log;
    error_log  /var/log/nginx/voidflippr-internal.error.log;

    location / {
        proxy_pass http://127.0.0.1:9865;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}