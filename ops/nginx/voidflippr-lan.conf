# VoidFlippr - LAN-only nginx config.
# Place at /etc/nginx/sites-available/voidflippr-lan and symlink into sites-enabled.
#
# Same upstream as the public config but binds to a private IP on a non-standard
# port so LAN devices can reach the game without going through the public
# hostname. Adjust the listen address and port to fit your network.

server {
    listen 8080;
    listen [::]:8080;
    # Bind to all interfaces by default. Comment out the second listen if you
    # only want IPv4, or replace the address to pin to a specific NIC.
    server_name _;

    client_max_body_size 1m;
    keepalive_timeout 65;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/voidflippr-lan.access.log;
    error_log  /var/log/nginx/voidflippr-lan.error.log;

    location / {
        proxy_pass http://127.0.0.1:9865;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}