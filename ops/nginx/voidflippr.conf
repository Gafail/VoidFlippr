# VoidFlippr - public-facing nginx config.
# Place at /etc/nginx/sites-available/voidflippr and symlink into sites-enabled.
#
# Listens on :80 for plaintext traffic. The cloudflared tunnel terminates TLS
# upstream of this; you can also add a 443 server block if you want to expose
# nginx directly to the public internet without a tunnel.
#
# Forwards all traffic to the internal VoidFlippr server on 127.0.0.1:9865
# (see ops/nginx/voidflippr-internal.conf for the upstream definition).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Reasonable defaults for a small game.
    client_max_body_size 1m;
    keepalive_timeout 65;

    # Cloudflare trusted proxies - see ops/nginx/cloudflare-ips.conf.
    include /etc/nginx/snippets/voidflippr-cloudflare-ips.conf;
    include /etc/nginx/snippets/voidflippr-realip.conf;

    # Security headers. Adjust if you find these break something.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/voidflippr.access.log;
    error_log  /var/log/nginx/voidflippr.error.log;

    location / {
        proxy_pass http://127.0.0.1:9865;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}